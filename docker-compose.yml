# Development services for `npm run dev` / `npm run worker`: PostgreSQL, Redis, MinIO and Mailpit.
#   docker compose up -d
# The app itself runs on the host (hot reload). To run the production image instead, use
# docker-compose.prod.yml (see docs/deployment-notes.md).
#
#   PostgreSQL  localhost:5432   (stockbook / stockbook)
#   Redis       localhost:6379
#   MinIO       localhost:9000   console http://localhost:9001 (minioadmin / minioadmin)
#   Mailpit     SMTP localhost:1025, inbox http://localhost:8025
name: stockbook

services:
  postgres:
    image: postgres:16.15-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36
    environment:
      POSTGRES_USER: stockbook
      POSTGRES_PASSWORD: stockbook
      POSTGRES_DB: stockbook
      TZ: Asia/Dhaka
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockbook -d stockbook"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Private S3-compatible storage (Bitnami build: the upstream minio/minio image is no longer published).
  minio:
    image: bitnamilegacy/minio:2025.7.23@sha256:8935e75fa5d11295c17171e4aa49efe390a1193cd7f12e4d21b92af9ffef09d7
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/bitnami/minio/data]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Catches every email in development. Set SMTP_HOST=localhost, SMTP_PORT=1025 in .env.
  mailpit:
    image: axllent/mailpit:v1.21.8@sha256:81370195cd4a0eab9604d17c2617a7525b0486f9365555253b6c5376c6350f1a
    ports: ["8025:8025", "1025:1025"]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:

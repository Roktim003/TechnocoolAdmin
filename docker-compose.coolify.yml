# TechnoCool Inventory (StockBook): production stack for Coolify ("Docker Compose" build pack).
#
#   app        Next.js web app + /api/v1 (public, port 3000). Runs migrations + seed on start.
#   worker     BullMQ worker: imports, PDFs, emails, push, scheduled reports (no port).
#   postgres   PostgreSQL 16 (internal only)
#   redis      Redis 7 with AOF + password (internal only)
#   minio      Private S3-compatible storage for photos, documents and imports (internal only)
#   backup     Nightly pg_dump + copy of the stored files into the `backups` volume
#
# Setup steps: docs/coolify.md. In short:
#   1. Coolify → + New → Application → this Git repo → Build pack "Docker Compose",
#      Docker Compose location: /docker-compose.coolify.yml
#   2. Domains for "app": https://inventory.your-domain.com:3000   (":3000" = container port, not public)
#   3. Environment variables: fill in the required ones (APP_URL, ADMIN_PASSWORD) and SMTP_* if wanted.
#      Every SERVICE_* value (DB/Redis/MinIO passwords, JWT secrets) is generated by Coolify.
#   4. Deploy.
#
# Nothing here publishes a host port: only the app is reachable, through Coolify's proxy (HTTPS).
# Variables are repeated per service on purpose (Coolify only passes a variable to services that list it).

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      # Coolify routes the domain set for this service to container port 3000.
      - SERVICE_URL_APP_3000
      # Must be exactly the public address users open, e.g. https://inventory.your-domain.com
      # (scheme + host, no trailing slash). Used for the CSRF check and links in emails.
      - APP_URL=${APP_URL:?}
      - TRUSTED_ORIGINS=${TRUSTED_ORIGINS:-}
      - NODE_ENV=production
      - TRUST_PROXY=true
      - COOKIE_SECURE=true
      - TZ=Asia/Dhaka
      - SERVICE_NAME=stockbook-app
      - RUN_MIGRATIONS=true
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/stockbook?schema=public
      - REDIS_URL=redis://default:${SERVICE_PASSWORD_REDIS}@redis:6379
      - "REDIS_KEY_PREFIX=sb:"
      - JWT_ACCESS_SECRET=${SERVICE_PASSWORD_64_JWTACCESS}
      - REFRESH_TOKEN_SECRET=${SERVICE_PASSWORD_64_JWTREFRESH}
      - JWT_ISSUER=stockbook
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_BUCKET=stockbook
      - S3_ACCESS_KEY_ID=${SERVICE_USER_MINIO}
      - S3_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_MINIO}
      - S3_FORCE_PATH_STYLE=true
      - S3_AUTO_CREATE_BUCKET=true
      # First admin account (created only if missing; change the password later in the app).
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?}
      - ADMIN_NAME=${ADMIN_NAME:-System Administrator}
      # false = start with empty suppliers / customers / projects (no demo data).
      - SEED_SAMPLE_DATA=${SEED_SAMPLE_DATA:-false}
      - COMPANY_NAME=${COMPANY_NAME:-Techno Cool Associates}
      - REPORT_QUERY_TIMEOUT_MS=${REPORT_QUERY_TIMEOUT_MS:-30000}
      # Email. Leave SMTP_HOST empty to run without email (in-app notifications still work).
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-TechnoCool Inventory <no-reply@your-domain.com>}
      # Phone push (Firebase service-account JSON or its base64). Empty = push off.
      - FCM_SERVICE_ACCOUNT=${FCM_SERVICE_ACCOUNT:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      # Migrations + seed run before the server starts.
      start_period: 120s
    restart: unless-stopped

  worker:
    # Same image as the app (Docker reuses the cached layers), different command.
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["node", "dist/worker.js"]
    environment:
      - APP_URL=${APP_URL:?}
      - NODE_ENV=production
      - TZ=Asia/Dhaka
      - SERVICE_NAME=stockbook-worker
      - RUN_MIGRATIONS=false
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATABASE_URL=postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/stockbook?schema=public
      - REDIS_URL=redis://default:${SERVICE_PASSWORD_REDIS}@redis:6379
      - "REDIS_KEY_PREFIX=sb:"
      - JWT_ACCESS_SECRET=${SERVICE_PASSWORD_64_JWTACCESS}
      - REFRESH_TOKEN_SECRET=${SERVICE_PASSWORD_64_JWTREFRESH}
      - JWT_ISSUER=stockbook
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_BUCKET=stockbook
      - S3_ACCESS_KEY_ID=${SERVICE_USER_MINIO}
      - S3_SECRET_ACCESS_KEY=${SERVICE_PASSWORD_MINIO}
      - S3_FORCE_PATH_STYLE=true
      - S3_AUTO_CREATE_BUCKET=true
      - COMPANY_NAME=${COMPANY_NAME:-Techno Cool Associates}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-TechnoCool Inventory <no-reply@your-domain.com>}
      - EMAIL_RETRY_DELAY_MS=${EMAIL_RETRY_DELAY_MS:-30000}
      - EMAIL_MAX_ATTEMPTS=${EMAIL_MAX_ATTEMPTS:-5}
      - FCM_SERVICE_ACCOUNT=${FCM_SERVICE_ACCOUNT:-}
    depends_on:
      # Wait until the app is healthy, i.e. migrations have finished.
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The worker has no HTTP server; turn off the image's HTTP health check.
    healthcheck:
      disable: true
    # Headless Chromium (PDF rendering) needs some shared memory.
    shm_size: 256m
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${SERVICE_USER_POSTGRES}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=stockbook
      - TZ=Asia/Dhaka
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      - REDIS_PASSWORD=${SERVICE_PASSWORD_REDIS}
    # AOF persistence keeps queued jobs across restarts; noeviction is what BullMQ needs.
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Private bucket; files are only ever served through the app's authenticated routes.
  # (Bitnami build: the upstream minio/minio image is no longer published.)
  minio:
    image: bitnamilegacy/minio:2025.7.23
    environment:
      - MINIO_ROOT_USER=${SERVICE_USER_MINIO}
      - MINIO_ROOT_PASSWORD=${SERVICE_PASSWORD_MINIO}
      - MINIO_BROWSER=off
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Every night at BACKUP_TIME (Asia/Dhaka): database dump (pg_dump custom format) and a
  # tar of the stored files, kept BACKUP_KEEP_DAYS days in the `backups` volume.
  # These stay on the same server: copy them off-site too (see docs/coolify.md).
  backup:
    image: postgres:16-alpine
    environment:
      - PGHOST=postgres
      - PGUSER=${SERVICE_USER_POSTGRES}
      - PGPASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - PGDATABASE=stockbook
      - TZ=Asia/Dhaka
      - BACKUP_TIME=${BACKUP_TIME:-02:30}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-14}
    volumes:
      - backups:/backups
      - miniodata:/minio-data:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u
        echo "[backup] daily at $$BACKUP_TIME, keeping $$BACKUP_KEEP_DAYS days"
        while true; do
          now=$$(date +%s)
          next=$$(date -d "$$BACKUP_TIME" +%s)
          [ "$$next" -le "$$now" ] && next=$$((next + 86400))
          sleep $$((next - now))
          stamp=$$(date +%Y-%m-%d_%H%M)
          if pg_dump -Fc -f "/backups/db-$$stamp.dump.tmp"; then
            mv "/backups/db-$$stamp.dump.tmp" "/backups/db-$$stamp.dump"
            echo "[backup] database ok: db-$$stamp.dump"
          else
            rm -f "/backups/db-$$stamp.dump.tmp"
            echo "[backup] DATABASE BACKUP FAILED"
          fi
          if tar -czf "/backups/files-$$stamp.tar.gz.tmp" -C /minio-data .; then
            mv "/backups/files-$$stamp.tar.gz.tmp" "/backups/files-$$stamp.tar.gz"
            echo "[backup] files ok: files-$$stamp.tar.gz"
          else
            rm -f "/backups/files-$$stamp.tar.gz.tmp"
            echo "[backup] FILES BACKUP FAILED"
          fi
          find /backups -type f \( -name 'db-*.dump' -o -name 'files-*.tar.gz' \) -mtime +$$BACKUP_KEEP_DAYS -delete
        done
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  backups:

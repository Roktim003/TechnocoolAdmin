# StockBook CI — every push and pull request. No deploy step: the server is connected later.
#
#   checks       install, lint, typecheck, unit tests
#   integration  integration tests against PostgreSQL 16 + Redis 7 + MinIO service containers,
#                then the authorization matrix and the backup / restore script test on their own
#   security     secret scan (gitleaks) and dependency audit (fails on high / critical)
#   image        builds the production image; on main also tags it with the commit, pushes it
#                to the GitHub container registry and runs the smoke test against a full stack
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.22.0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: stockbook
          POSTGRES_PASSWORD: stockbook
          POSTGRES_DB: stockbook_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U stockbook -d stockbook_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7.4.11-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
      minio:
        image: bitnamilegacy/minio:2025.7.23
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports: ["9100:9000"]
        options: >-
          --health-cmd "curl -fs http://localhost:9000/minio/health/live"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: PostgreSQL 16 client tools and openssl (backups, restore tests, scripts)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16 openssl && pg_dump --version
      - name: Chrome for PDF rendering
        uses: browser-actions/setup-chrome@v1
        id: chrome
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - name: Integration tests
        env:
          PDF_BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: npx vitest run --project integration --exclude tests/integration/authorization-matrix.test.ts --exclude tests/integration/backup-restore.test.ts
      - name: Authorization matrix (every endpoint × every role; fails on an unlisted route)
        run: npm run test:matrix
      - name: Backup + restore scripts against a temporary database
        run: npx vitest run --project integration tests/integration/backup-restore.test.ts

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 \
            git /repo --config /repo/.gitleaks.toml --redact --verbose --exit-code 1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Dependency audit (fails on high / critical; reviewed exceptions in security/audit-allowlist.json)
        run: npm run audit:deps

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [checks]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: stockbook:ci,stockbook:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image runs as a non-root user and has its tools
        run: |
          test "$(docker run --rm --entrypoint id stockbook:ci -u)" = "1001"
          docker run --rm --entrypoint sh stockbook:ci -c 'pg_dump --version && openssl version && chromium --version && fc-list | grep -qi "Noto Sans Bengali" && fc-list | grep -qi "IBM Plex Sans"'

      - name: Full stack + smoke test (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          gen() { node -e "console.log(require('crypto').randomBytes(36).toString('base64url'))"; }
          cat > .env.prod <<EOF
          APP_URL=http://localhost:3000
          COOKIE_SECURE=false
          POSTGRES_PASSWORD=$(gen)
          REDIS_PASSWORD=$(gen)
          JWT_ACCESS_SECRET=$(gen)
          REFRESH_TOKEN_SECRET=$(gen)
          ADMIN_PASSWORD=Smoke-$(gen)
          S3_ACCESS_KEY_ID=stockbook
          S3_SECRET_ACCESS_KEY=$(gen)
          STOCKBOOK_IMAGE=stockbook:ci
          SEED_SAMPLE_DATA=true
          EOF
          docker compose -f docker-compose.prod.yml --env-file .env.prod --profile local up -d --no-build --wait --wait-timeout 300
          ADMIN_PASSWORD=$(grep ^ADMIN_PASSWORD= .env.prod | cut -d= -f2-)
          SMOKE_URL=http://localhost:3000 SMOKE_USERNAME=admin SMOKE_PASSWORD="$ADMIN_PASSWORD" node scripts/smoke-test.mjs
      - name: Stack logs on failure
        if: failure() && github.ref == 'refs/heads/main'
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod logs --no-color --tail 200

      - name: Tag with the commit and push (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker tag stockbook:ci "$IMAGE:${{ github.sha }}"
          docker tag stockbook:ci "$IMAGE:main"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:main"

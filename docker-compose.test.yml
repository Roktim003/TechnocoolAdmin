# Throw-away PostgreSQL + Redis + MinIO for the integration tests (ports 5433 / 6380 / 9100, data in tmpfs).
#   npm run test:db:up && npm test && npm run test:db:down
name: stockbook-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stockbook
      POSTGRES_PASSWORD: stockbook
      POSTGRES_DB: stockbook_test
    ports: ["5433:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockbook -d stockbook_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-test:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-test:
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9100:9000"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30
